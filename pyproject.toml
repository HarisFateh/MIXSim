[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixsim"
version = "1.0.0"
description = "Multiclass first-order macroscopic traffic simulation framework for mixed-autonomy signalized urban networks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Muhammad Haris"},
  {name = "Claudio Roncoli"},
]
keywords = [
  "traffic simulation",
  "cell transmission model",
  "mixed autonomy",
  "connected automated vehicles",
  "traffic signal control",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy", "pandas", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/HarisFateh/MIXSim"
Repository = "https://github.com/HarisFateh/MIXSim"
Issues = "https://github.com/HarisFateh/MIXSim/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
